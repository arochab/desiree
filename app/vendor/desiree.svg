<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="lueur" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#EAFBF6"/>
      <stop offset="34%" stop-color="#5EEAD4"/>
      <stop offset="72%" stop-color="#6E7BE6"/>
      <stop offset="100%" stop-color="#3A2F6B"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="46%" r="60%">
      <stop offset="55%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="80%" stop-color="#5EEAD4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="doux" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <!-- fond obsidienne (coin arrondi gere par le maskable cote OS) -->
  <rect width="512" height="512" rx="112" fill="#0C0B0A"/>
  <!-- halo diffus -->
  <circle cx="256" cy="236" r="190" fill="url(#halo)"/>
  <!-- la presence : coeur sombre, bord qui rayonne (mint -> violet) -->
  <circle cx="256" cy="236" r="132" fill="url(#lueur)"/>
  <!-- coeur legerement creuse pour l'effet "presence" -->
  <circle cx="256" cy="236" r="96" fill="#0C0B0A" opacity="0.55" filter="url(#doux)"/>
  <!-- eclat sur le fil superieur -->
  <path d="M170 168 A132 132 0 0 1 342 168" fill="none" stroke="#EAFBF6" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
</svg>
